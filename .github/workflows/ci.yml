name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            cc: gcc
          - name: linux-clang
            cc: clang
          - name: linux-clang-asan-ubsan
            cc: clang
            cflags: -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all
    env:
      CC: ${{ matrix.cc }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config

      - name: Generate build system
        run: ./autogen.sh

      - name: Configure
        env:
          SAN_FLAGS: ${{ matrix.cflags }}
        run: ./configure ${SAN_FLAGS:+"CFLAGS=$SAN_FLAGS" "LDFLAGS=$SAN_FLAGS"}

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        run: make check

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            config.log
            test-data/*.log
            test-data/*.trs
          if-no-files-found: ignore
